<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD GAME BAJAR Admin</title>
<style>
body {
  margin:0;
  padding:15px;
  background:#101522;
  color:white;
  font-family:Arial,sans-serif;
}
header,.panel {
  background:#1b263b;
  padding:16px;
  margin-bottom:15px;
  border-radius:12px;
}
header { text-align:center; }
h1,h2 { color:#00e6ad; }
input,button {
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:7px 0;
  border:0;
  border-radius:7px;
}
button {
  background:#00c995;
  color:#071b17;
  font-weight:bold;
}
button:disabled { opacity:.5; }
#dashboard { display:none; }
#message,#packageMessage { color:#ffd166; }
.item {
  background:#263650;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
}
.item button { width:auto; padding:10px; }
</style>
</head>
<body>

<header>
  <h1>BD GAME BAJAR</h1>
  <p>Admin Dashboard</p>
</header>

<div class="panel" id="loginBox">
  <h2>Admin Login</h2>
  <form id="loginForm">
    <input id="email" type="email"
      placeholder="Admin Email" required>
    <input id="password" type="password"
      placeholder="Password" required>
    <button id="loginBtn" type="submit">Login</button>
  </form>
  <p id="message">Email ও Password দিয়ে Login করো।</p>
</div>

<div id="dashboard">
  <div class="panel">
    <h2>Package Management</h2>
    <input id="packageName" placeholder="Package Name">
    <input id="diamonds" type="number" placeholder="Diamond Amount">
    <input id="price" type="number" placeholder="Price BDT">
    <button id="addBtn">Add Package</button>
    <p id="packageMessage"></p>
  </div>

  <div class="panel">
    <h2>All Packages</h2>
    <div id="packageList">লোড হচ্ছে...</div>
  </div>

  <div class="panel">
    <button id="logoutBtn">Logout</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
"https://qvmtlmefklbosxjinagk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ou7vq5uj85eVdM8nJH04AA_m1FeVb6b";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const packageList = document.getElementById("packageList");
const packageMessage = document.getElementById("packageMessage");

function showDashboard() {
  loginBox.style.display = "none";
  dashboard.style.display = "block";
  loadPackages();
}

async function checkSession() {
  try {
    const { data, error } = await client.auth.getSession();
    if (error) throw error;

    if (data.session) {
      showDashboard();
    }
  } catch (error) {
    message.textContent = "Session Error: " + error.message;
  }
}

document.getElementById("loginForm").addEventListener(
  "submit", async function(event) {
    event.preventDefault();

    loginBtn.disabled = true;
    loginBtn.textContent = "অপেক্ষা করো...";
    message.textContent = "Supabase Login চেষ্টা চলছে...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const loginPromise = client.auth.signInWithPassword({
        email: email,
        password: password
      });

      const timeoutPromise = new Promise((_, reject) => {
        setTimeout(() => reject(
          new Error("সময় শেষ। ইন্টারনেট ও Supabase সংযোগ পরীক্ষা করো।")
        ), 15000);
      });

      const { data, error } = await Promise.race([
        loginPromise,
        timeoutPromise
      ]);

      if (error) throw error;

      if (!data.session) {
        throw new Error("Login Session পাওয়া যায়নি।");
      }

      message.textContent = "Login সফল হয়েছে!";
      showDashboard();

    } catch (error) {
      message.textContent = "Login Error: " + error.message;
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Login";
    }
  }
);

async function loadPackages() {
  packageList.textContent = "প্যাকেজ লোড হচ্ছে...";

  try {
    const { data, error } = await client
      .from("game_packages")
      .select("id,name,diamonds,price_bdt,active")
      .order("diamonds");

    if (error) throw error;

    packageList.innerHTML = "";

    if (!data || data.length === 0) {
      packageList.textContent = "কোনো প্যাকেজ পাওয়া যায়নি।";
      return;
    }

    data.forEach(function(item) {
      const div = document.createElement("div");
      div.className = "item";

      const title = document.createElement("p");
      title.textContent =
        item.name + " | " + item.diamonds +
        " Diamonds | ৳" + item.price_bdt +
        " | " + (item.active ? "Active" : "Inactive");

      const priceInput = document.createElement("input");
      priceInput.type = "number";
      priceInput.value = item.price_bdt;

      const save = document.createElement("button");
      save.textContent = "Save Price";

      save.onclick = async function() {
        const newPrice = Number(priceInput.value);

        if (!Number.isFinite(newPrice) || newPrice <= 0) {
          alert("সঠিক দাম দাও।");
          return;
        }

        const { error } = await client
          .from("game_packages")
          .update({price_bdt:newPrice})
          .eq("id",item.id);

        if (error) {
          alert("দাম পরিবর্তন হয়নি: " + error.message);
        } else {
          alert("দাম পরিবর্তন হয়েছে।");
          loadPackages();
        }
      };

      const toggle = document.createElement("button");
      toggle.textContent = item.active ? "Deactivate" : "Activate";

      toggle.onclick = async function() {
        const { error } = await client
          .from("game_packages")
          .update({active:!item.active})
          .eq("id",item.id);

        if (error) {
          alert("পরিবর্তন হয়নি: " + error.message);
        } else {
          loadPackages();
        }
      };

      div.appendChild(title);
      div.appendChild(priceInput);
      div.appendChild(save);
      div.appendChild(toggle);
      packageList.appendChild(div);
    });

  } catch (error) {
    packageList.textContent = "Package Error: " + error.message;
  }
}

document.getElementById("addBtn").onclick = async function() {
  const name = document.getElementById("packageName").value.trim();
  const diamonds = Number(document.getElementById("diamonds").value);
  const price = Number(document.getElementById("price").value);

  if (!name || !Number.isInteger(diamonds) ||
      diamonds <= 0 || !Number.isFinite(price) || price <= 0) {
    packageMessage.textContent = "সঠিক তথ্য পূরণ করো।";
    return;
  }

  packageMessage.textContent = "প্যাকেজ যোগ হচ্ছে...";

  const { error } = await client
    .from("game_packages")
    .insert({
      name:name,
      diamonds:diamonds,
      price_bdt:price,
      active:true
    });

  if (error) {
    packageMessage.textContent = "Error: " + error.message;
  } else {
    packageMessage.textContent = "প্যাকেজ যোগ হয়েছে!";
    document.getElementById("packageName").value = "";
    document.getElementById("diamonds").value = "";
    document.getElementById("price").value = "";
    loadPackages();
  }
};

document.getElementById("logoutBtn").onclick = async function() {
  await client.auth.signOut();
  location.reload();
};

checkSession();
</script>
</body>
</html>
