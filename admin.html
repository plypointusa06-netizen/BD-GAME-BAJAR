<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD GAME BAJAR Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif}
header{background:#17243a;padding:18px;text-align:center}
h2{color:#38bdf8}
main{max-width:950px;margin:auto;padding:15px}
.card{background:#1e293b;padding:18px;border-radius:12px;margin:15px 0}
input,select,button{width:100%;padding:12px;margin:7px 0;border:0;border-radius:7px}
input,select{background:#334155;color:white}
button{background:#0284c7;color:white;font-weight:bold;cursor:pointer}
.danger{background:#dc2626}
.success{background:#16a34a}
.small{width:auto;padding:8px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:10px;border-bottom:1px solid #475569;text-align:left}
.table-wrap{overflow-x:auto}
.hidden{display:none}
.msg{color:#fbbf24}
</style>
</head>
<body>
<header>
<h2>BD GAME BAJAR</h2>
<p>Admin Control Panel</p>
</header>

<main>
<section id="loginBox" class="card">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMsg" class="msg"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h3>Admin Dashboard</h3>
<p id="adminEmail"></p>
<button class="danger" onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Add Diamond Package</h3>
<input id="pname" placeholder="Package Name">
<input id="diamonds" type="number" placeholder="Diamond Amount">
<input id="price" type="number" placeholder="Price (BDT)">
<button onclick="addPackage()">Add Package</button>
<p id="packageMsg" class="msg"></p>
</div>

<div class="card">
<h3>All Packages</h3>
<button onclick="loadPackages()">Refresh Packages</button>
<div class="table-wrap">
<table>
<thead><tr>
<th>Name</th><th>Diamonds</th><th>Price</th><th>Status</th><th>Action</th>
</tr></thead>
<tbody id="packageRows"></tbody>
</table>
</div>
</div>

<div class="card">
<h3>Manage Orders</h3>
<button onclick="loadOrders()">Refresh Orders</button>
<div class="table-wrap">
<table>
<thead><tr>
<th>ID</th><th>Player UID</th><th>Package</th><th>Diamonds</th><th>Price</th><th>Payment</th><th>Transaction</th><th>Status</th><th>Update</th>
</tr></thead>
<tbody id="orderRows"></tbody>
</table>
</div>
<p id="orderMsg" class="msg"></p>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://qvmtlmefklbosxjinagk.supabase.co";
const SUPABASE_KEY = "sb_publishable_ou7vq5uj85eVdM8nJH04AA_m1FeVb6b";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("loginMsg");
 msg.textContent="Logging in...";
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){msg.textContent=error.message;return;}
 await checkAdmin();
}

async function checkAdmin(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){
  showLogin();
  return;
 }
 const {data,error}=await db
 .from("admin_users")
 .select("user_id,email")
 .eq("user_id",session.user.id)
 .maybeSingle();

 if(error || !data){
  await db.auth.signOut();
  showLogin();
  document.getElementById("loginMsg").textContent=
   "এই অ্যাকাউন্ট Admin হিসেবে অনুমোদিত নয়।";
  return;
 }

 document.getElementById("loginBox").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 document.getElementById("adminEmail").textContent=data.email;
 await loadPackages();
 await loadOrders();
}

function showLogin(){
 document.getElementById("loginBox").classList.remove("hidden");
 document.getElementById("dashboard").classList.add("hidden");
}

async function logout(){
 await db.auth.signOut();
 showLogin();
}

async function addPackage(){
 const name=document.getElementById("pname").value.trim();
 const diamonds=Number(document.getElementById("diamonds").value);
 const price=Number(document.getElementById("price").value);
 const msg=document.getElementById("packageMsg");

 if(!name || diamonds<=0 || price<=0){
  msg.textContent="সঠিক তথ্য দিন";
  return;
 }

 const {error}=await db.from("game_packages").insert({
  name,diamonds,price_bdt:price,active:true
 });

 if(error){msg.textContent=error.message;return;}
 msg.textContent="Package যোগ হয়েছে";
 document.getElementById("pname").value="";
 document.getElementById("diamonds").value="";
 document.getElementById("price").value="";
 await loadPackages();
}

async function loadPackages(){
 const tbody=document.getElementById("packageRows");
 tbody.innerHTML="<tr><td colspan='5'>Loading...</td></tr>";

 const {data,error}=await db.from("game_packages")
  .select("*").order("created_at",{ascending:false});

 if(error){
  tbody.innerHTML="<tr><td colspan='5'>"+escapeHTML(error.message)+"</td></tr>";
  return;
 }

 tbody.innerHTML="";
 (data||[]).forEach(p=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`
   <td>${escapeHTML(p.name)}</td>
   <td>${p.diamonds}</td>
   <td>৳${p.price_bdt}</td>
   <td>${p.active?"Active":"Inactive"}</td>
   <td>
    <button class="small" onclick="editPrice(${p.id},${Number(p.price_bdt)})">Price</button>
    <button class="small ${p.active?'danger':'success'}" onclick="togglePackage(${p.id},${!p.active})">${p.active?"Off":"On"}</button>
   </td>`;
  tbody.appendChild(tr);
 });
}

async function editPrice(id,oldPrice){
 const value=prompt("নতুন দাম লিখুন",oldPrice);
 if(value===null)return;
 const price=Number(value);
 if(!Number.isFinite(price)||price<=0){
  alert("সঠিক দাম লিখুন");
  return;
 }
 const {error}=await db.from("game_packages")
  .update({price_bdt:price}).eq("id",id);
 if(error)alert(error.message);
 else await loadPackages();
}

async function togglePackage(id,active){
 const {error}=await db.from("game_packages")
  .update({active}).eq("id",id);
 if(error)alert(error.message);
 else await loadPackages();
}

async function loadOrders(){
 const tbody=document.getElementById("orderRows");
 const msg=document.getElementById("orderMsg");
 tbody.innerHTML="<tr><td colspan='9'>Loading...</td></tr>";

 const {data,error}=await db.from("topup_orders")
  .select("*").order("created_at",{ascending:false});

 if(error){
  tbody.innerHTML="";
  msg.textContent=error.message;
  return;
 }
 msg.textContent="";
 tbody.innerHTML="";

 (data||[]).forEach(o=>{
  const tr=document.createElement("tr");
  const status=["pending","processing","completed","cancelled"];
  const options=status.map(s=>
   `<option value="${s}" ${o.status===s?"selected":""}>${s}</option>`
  ).join("");

  tr.innerHTML=`
   <td>${o.id}</td>
   <td>${escapeHTML(o.player_uid)}</td>
   <td>${escapeHTML(o.package_name)}</td>
   <td>${o.diamonds}</td>
   <td>৳${o.price_bdt}</td>
   <td>${escapeHTML(o.payment_method||"-")}</td>
   <td>${escapeHTML(o.transaction_ref||"-")}</td>
   <td>${escapeHTML(o.status||"pending")}</td>
   <td>
    <select id="status-${o.id}">${options}</select>
    <button class="small" onclick="updateOrder(${o.id})">Update</button>
   </td>`;
  tbody.appendChild(tr);
 });
}

async function updateOrder(id){
 const status=document.getElementById("status-"+id).value;
 const {error}=await db.from("topup_orders")
  .update({status}).eq("id",id);
 if(error){
  alert(error.message);
  return;
 }
 alert("Order status updated");
 await loadOrders();
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

db.auth.onAuthStateChange((event)=>{
 if(event==="SIGNED_OUT")showLogin();
});

checkAdmin();
</script>
</body>
</html>
