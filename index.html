<section class="hero">

  <p>Choose Your Diamond Package</p>
</section>

<main class="container">

  <h3>💎 Diamond Packages</h3>

  <div id="packages">
    Loading...
  </div>

  <h3>📝 Demo Order Form</h3>

  <form id="orderForm">

    <input
      type="text"
      id="playerUID"
      placeholder="Enter Free Fire Player UID"
      required
    >

    <select id="packageSelect" required>
      <option value="">Select Diamond Package</option>
    </select>

    <button type="submit">Place Demo Order</button>

  </form>

  <p class="note">
    এটি একটি ডেমো ওয়েবসাইট। এখনো কোনো বাস্তব অর্ডার বা পেমেন্ট গ্রহণ করা হয় না।
  </p>

</main>

<footer>

<script>
const packages = [let packages = [];

async function loadPackages() {
  const { data, error } = await supabaseClient
    .from("game_packages")
    .select("name, diamonds, price_bdt")
    .eq("active", true)
    .order("diamonds");

  if (error) {
    document.getElementById("packages").textContent =
      "প্যাকেজ লোড করা যায়নি।";
    return;
  }

  packages = data;

  const box = document.getElementById("packages");
  const select = document.getElementById("packageSelect");

  box.innerHTML = "";
  select.innerHTML = '<option value="">Select Diamond Package</option>';

  data.forEach(function(item) {
    const card = document.createElement("div");
    card.className = "pack";

    const name = document.createElement("span");
    name.textContent = item.diamonds + " Diamonds";

    const price = document.createElement("span");
    price.className = "price";
    price.textContent = "৳" + item.price_bdt;

    card.appendChild(name);
    card.appendChild(price);
    box.appendChild(card);

    const option = document.createElement("option");
    option.value = item.diamonds;
    option.textContent =
      item.diamonds + " Diamonds - ৳" + item.price_bdt;

    select.appendChild(option);
  });
}

loadPackages();
