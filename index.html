<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD GAME BAJAR</title>
<style>
body {
  margin: 0;
  padding: 15px;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 20px;
  background: #17233b;
  border-radius: 12px;
}
h1 { color: #00e6ad; }
.panel {
  background: #1b263b;
  padding: 16px;
  margin-top: 18px;
  border-radius: 12px;
}
h2 { color: #00e6ad; }
#status { color: #ffd166; }
#packages {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.pack {
  background: #263650;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
}
.price { color: #00e6ad; font-weight: bold; }
input, select, button {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  box-sizing: border-box;
  border: 0;
  border-radius: 7px;
}
button {
  background: #00c995;
  font-weight: bold;
}
</style>
</head>
<body>

<header>
  <h1>BD GAME BAJAR</h1>
  <p>Free Fire Diamond Top Up</p>
</header>

<div class="panel">
  <h2>Connection Test</h2>
  <p id="status">JavaScript শুরু হচ্ছে...</p>
</div>

<div class="panel">
  <h2>Diamond Packages</h2>
  <div id="packages"></div>
</div>

<div class="panel">
  <h2>Demo Order</h2>
  <form id="orderForm">
    <input id="playerUid" placeholder="Free Fire Player UID" required>
    <select id="packageSelect" required>
      <option value="">Package নির্বাচন করো</option>
    </select>
    <button type="submit">Create Demo Order</button>
  </form>
  <p>এটি শুধু ডেমো। অর্ডার সার্ভারে জমা হবে না।</p>
</div>

<script>
document.getElementById("status").textContent =
  "JavaScript চলছে! Supabase পরীক্ষা হচ্ছে...";

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://qvmtlmefklbosxjinagk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ou7vq5uj85eVdM8nJH04AA_m1FeVb6b";

const statusBox = document.getElementById("status");
const packagesBox = document.getElementById("packages");
const packageSelect = document.getElementById("packageSelect");

async function startApp() {
  try {
    if (!window.supabase) {
      throw new Error("Supabase library load হয়নি");
    }

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    statusBox.textContent = "Supabase সংযোগ হচ্ছে...";

    const { data, error } = await client
      .from("game_packages")
      .select("name, diamonds, price_bdt")
      .eq("active", true)
      .order("diamonds");

    if (error) throw error;

    packagesBox.innerHTML = "";
    packageSelect.innerHTML =
      '<option value="">Package নির্বাচন করো</option>';

    if (!data || data.length === 0) {
      statusBox.textContent = "কোনো Active Package নেই।";
      return;
    }

    data.forEach(function(item) {
      const card = document.createElement("div");
      card.className = "pack";

      const name = document.createElement("p");
      name.textContent = item.diamonds + " Diamonds";

      const price = document.createElement("p");
      price.className = "price";
      price.textContent = "৳" + item.price_bdt;

      card.appendChild(name);
      card.appendChild(price);
      packagesBox.appendChild(card);

      const option = document.createElement("option");
      option.value = item.diamonds;
      option.textContent =
        item.diamonds + " Diamonds - ৳" + item.price_bdt;

      packageSelect.appendChild(option);
    });

    statusBox.textContent =
      "সফল! " + data.length + "টি Package লোড হয়েছে।";

  } catch (error) {
    console.error(error);
    statusBox.textContent = "ERROR: " + error.message;
  }
}

document.getElementById("orderForm").addEventListener(
  "submit",
  function(event) {
    event.preventDefault();
    alert("এটি Demo Order। সার্ভারে জমা হয়নি।");
  }
);

startApp();
</script>

</body>
</html>
