<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD GAME BAJAR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101522;
      color: white;
    }
    header {
      background: #17233b;
      padding: 22px 12px;
      text-align: center;
      border-bottom: 2px solid #00d9a5;
    }
    header h1 { color: #00e6ad; margin: 0; }
    header p { color: #cbd5e1; }
    main {
      max-width: 650px;
      margin: 22px auto;
      padding: 15px;
    }
    .panel {
      background: #1b263b;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 18px;
    }
    h2 { color: #00e6ad; margin-top: 0; }
    #status {
      color: #ffd166;
      font-size: 14px;
      margin-bottom: 12px;
    }
    #packages {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .pack {
      background: #263650;
      padding: 15px 8px;
      border-radius: 9px;
      text-align: center;
      border: 1px solid #40516c;
    }
    .pack strong { display: block; margin-bottom: 8px; }
    .price { color: #00e6ad; font-weight: bold; }
    input, select, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 7px;
      border: 0;
      font-size: 15px;
    }
    input, select {
      background: #eef2f7;
      color: #111827;
    }
    button {
      background: #00c995;
      color: #071b17;
      font-weight: bold;
      cursor: pointer;
    }
    .note {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.6;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <header>
    <h1>BD GAME BAJAR</h1>
    <p>Free Fire Diamond Top Up</p>
  </header>

  <main>
    <section class="panel">
      <h2>Diamond Packages</h2>
      <div id="status">প্যাকেজ লোড হচ্ছে...</div>
      <div id="packages"></div>
    </section>

    <section class="panel">
      <h2>Order Form</h2>
      <form id="orderForm">
        <input
          type="text"
          id="playerUid"
          placeholder="Free Fire Player UID"
          required
        >

        <select id="packageSelect" required>
          <option value="">প্যাকেজ লোড হচ্ছে...</option>
        </select>

        <button type="submit">Create Demo Order</button>
      </form>
      <p class="note">
        এটি ডেমো ফর্ম। কোনো টাকা নেওয়া হবে না এবং
        অর্ডার সার্ভারে জমা হবে না।
      </p>
    </section>
  </main>

  <footer>© 2026 BD GAME BAJAR</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://qvmtlmefklbosxjinagk.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ou7vq5uj85eVdM8nJH04AA_m1FeVb6b";

    const statusBox = document.getElementById("status");
    const packagesBox = document.getElementById("packages");
    const packageSelect = document.getElementById("packageSelect");

    async function startApp() {
      try {
        if (!window.supabase) {
          throw new Error("Supabase library load হয়নি");
        }

        const supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        statusBox.textContent = "Supabase সংযোগ হচ্ছে...";

        const { data, error } = await supabaseClient
          .from("game_packages")
          .select("name, diamonds, price_bdt")
          .eq("active", true)
          .order("diamonds");

        if (error) throw error;

        packagesBox.innerHTML = "";
        packageSelect.innerHTML =
          '<option value="">প্যাকেজ নির্বাচন করো</option>';

        if (!data || data.length === 0) {
          statusBox.textContent = "কোনো Active Package পাওয়া যায়নি।";
          return;
        }

        data.forEach(function(item) {
          const card = document.createElement("div");
          card.className = "pack";

          const name = document.createElement("strong");
          name.textContent = item.diamonds + " Diamonds";

          const price = document.createElement("div");
          price.className = "price";
          price.textContent = "৳" + item.price_bdt;

          card.appendChild(name);
          card.appendChild(price);
          packagesBox.appendChild(card);

          const option = document.createElement("option");
          option.value = item.diamonds;
          option.textContent =
            item.diamonds + " Diamonds - ৳" + item.price_bdt;

          packageSelect.appendChild(option);
        });

        statusBox.textContent =
          "সফলভাবে " + data.length + "টি প্যাকেজ লোড হয়েছে।";

      } catch (error) {
        console.error("App error:", error);
        statusBox.textContent =
          "সমস্যা হয়েছে: " + (error.message || "Unknown error");
      }
    }

    document.getElementById("orderForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const uid = document.getElementById("playerUid").value.trim();
        const selected = packageSelect.value;

        if (!uid || !selected) {
          alert("UID এবং Package নির্বাচন করো।");
          return;
        }

        alert(
          "Demo Order Created!\n" +
          "Player UID: " + uid +
          "\nPackage: " + selected +
          "\n\nএটি শুধু ডেমো। অর্ডার সার্ভারে জমা হয়নি।"
        );
      });

    startApp();
  </script>
</body>
</html>
